<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STELLAR MOTH</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #060606;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
  }

  /* ── 3D perspective tilt on the whole unit ── */
  #crt-outer {
    transform: perspective(1100px) rotateX(2deg);
    transform-origin: center 58%;
  }

  /* ── Main housing face ── */
  #crt-body {
    display: flex;
    align-items: stretch;
    background: linear-gradient(158deg, #343434 0%, #202020 40%, #232323 70%, #2e2e2e 100%);
    border-radius: 10px 10px 4px 4px;
    padding: 12px 14px 10px;
    gap: 12px;
    box-shadow:
      inset 0 3px 6px rgba(255,255,255,0.07),
      inset 3px 0 5px rgba(255,255,255,0.03),
      inset -3px 0 5px rgba(0,0,0,0.2),
      inset 0 -6px 14px rgba(0,0,0,0.55),
      /* Stepped 3D bottom extrusion */
      0  4px 0 #1e1e1e,
      0  8px 0 #141414,
      0  0  0 1.5px #0c0c0c,
      0 22px 60px rgba(0,0,0,0.97);
  }

  /* ── Bottom function-key strip ── */
  #crt-bottom {
    background: linear-gradient(158deg, #2e2e2e 0%, #1c1c1c 50%, #252525 100%);
    border-radius: 0 0 10px 10px;
    padding: 7px 14px 9px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow:
      inset 0 3px 5px rgba(0,0,0,0.45),
      inset 0 -2px 5px rgba(0,0,0,0.3),
      0  4px 0 #0e0e0e,
      0  7px 0 #080808,
      0 20px 50px rgba(0,0,0,0.9);
  }

  /* ── Side panels ── */
  .crt-side {
    width: 112px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  /* ── Side mini-screens ── */
  .side-screen {
    border: 2px solid #0c0c0c;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.9), 0 0 7px rgba(20,90,255,0.1);
  }
  /* Convex glass overlay on side screens */
  .side-screen::after {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 30% 24%, rgba(255,255,255,0.045) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 50%, transparent 28%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 5;
    border-radius: inherit;
  }
  /* Scanlines overlay for side screens */
  .side-scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom, transparent 0px, transparent 2px,
      rgba(0,0,0,0.2) 2px, rgba(0,0,0,0.2) 4px
    );
    pointer-events: none;
    z-index: 4;
  }
  /* Score / Lives screen text styles */
  .ss-data-label {
    font-size: 7px;
    color: rgba(80,175,255,0.75);
    letter-spacing: 2px;
    line-height: 1.5;
  }
  .ss-data-value {
    font-size: 12px;
    color: rgba(80,210,255,0.95);
    letter-spacing: 1px;
    line-height: 1.3;
    font-family: 'Courier New', monospace;
  }
  .ss-data-dim {
    font-size: 9px;
    color: rgba(60,170,255,0.55);
    letter-spacing: 1px;
    font-family: 'Courier New', monospace;
  }
  .ss-life-row {
    font-size: 10px;
    color: rgba(80,210,255,0.95);
    letter-spacing: 4px;
    line-height: 1.4;
    font-family: 'Courier New', monospace;
  }
  .side-screen-content {
    height: 66px;
    background: #00070f;
    padding: 6px 5px;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    overflow: hidden;
  }
  .ss-line { height: 2px; background: rgba(40,150,255,0.45); border-radius: 1px; }
  .ss-line.dim { background: rgba(40,150,255,0.15); }
  .side-screen-label {
    background: #090909;
    font-size: 7px;
    color: #3a5570;
    text-align: center;
    padding: 3px 2px;
    letter-spacing: 2.5px;
    border-top: 1px solid #070707;
  }
  /* Bar-graph variant */
  .side-bars { justify-content: space-around; }
  .bar-row { display: flex; align-items: center; height: 11px; }
  .bar { height: 6px; background: rgba(30,110,255,0.5); border-radius: 1px; }

  /* ── Button panel ── */
  .btn-panel {
    background: #181818;
    border-radius: 4px;
    padding: 8px 7px;
    border: 1px solid #0f0f0f;
    box-shadow: inset 0 1px 4px rgba(0,0,0,0.7);
  }
  .panel-label {
    font-size: 7px;
    color: #505050;
    letter-spacing: 2px;
    text-align: center;
    margin-bottom: 8px;
  }
  .btn-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
  }
  .btn {
    height: 21px;
    border-radius: 3px;
    cursor: pointer;
    box-shadow:
      inset 0 1px 2px rgba(255,255,255,0.08),
      0 2px 0 rgba(0,0,0,0.65),
      0 3px 0 rgba(0,0,0,0.3);
  }
  .btn-red  { background: linear-gradient(to bottom, #7a1515, #4a0d0d); }
  .btn-yel  { background: linear-gradient(to bottom, #7a6010, #4a3a08); }
  .btn-grn  { background: linear-gradient(to bottom, #0f5a0f, #083508); }
  .btn-blu  { background: linear-gradient(to bottom, #063a72, #031e40); }
  .btn-grey { background: linear-gradient(to bottom, #363636, #212121); }
  .btn-silv { background: linear-gradient(to bottom, #5a5a5a, #363636); }
  .btn-pink { background: linear-gradient(to bottom, #7a1258, #4a0935); }
  .btn-nvy  { background: linear-gradient(to bottom, #14106a, #09063a); }
  .btn-neon { background: radial-gradient(ellipse at 50% 40%, #0a1a0a 0%, #020702 65%); box-shadow: inset 0 1px 2px rgba(255,255,255,0.06), 0 2px 0 rgba(0,0,0,0.65), 0 3px 0 rgba(0,0,0,0.3); }
  .btn-def  { background: linear-gradient(to bottom, #3a0a6a, #1e0538); }

  /* ── Vents ── */
  .vent-section { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
  .vents {
    height: 54px;
    background: repeating-linear-gradient(
      to bottom,
      #141414 0px, #141414 3px,
      #0b0b0b 3px, #0b0b0b 4px,
      #191919 4px, #191919 7px,
      #0b0b0b 7px, #0b0b0b 8px
    );
    border-radius: 3px;
    border: 1px solid #0f0f0f;
    box-shadow: inset 0 1px 5px rgba(0,0,0,0.85);
  }

  /* ── Knob section ── */
  .knob-section {
    background: #181818;
    border-radius: 4px;
    padding: 8px 6px;
    border: 1px solid #0f0f0f;
    box-shadow: inset 0 1px 4px rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .knob-row { display: flex; gap: 14px; }
  .knob-col { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .knob-label { font-size: 7px; color: #585858; letter-spacing: 1.5px; }
  .knob {
    width: 33px;
    height: 33px;
    border-radius: 50%;
    background: radial-gradient(circle at 36% 36%, #4a4a4a, #111);
    border: 2px solid #0d0d0d;
    position: relative;
    box-shadow: 0 2px 5px rgba(0,0,0,0.75), inset 0 1px 2px rgba(255,255,255,0.06);
    cursor: grab;
    user-select: none;
  }
  .knob:active { cursor: grabbing; }
  .knob-tick {
    position: absolute;
    width: 2px; height: 10px;
    background: #888;
    top: 4px; left: 50%;
    border-radius: 1px;
    transform-origin: bottom center;
    transform: translateX(-50%) rotate(-45deg);
  }

  /* ── Indicator LEDs ── */
  .indicator-section {
    background: #181818;
    border-radius: 4px;
    padding: 7px 8px;
    border: 1px solid #0f0f0f;
    box-shadow: inset 0 1px 4px rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .ind-row { display: flex; align-items: center; gap: 7px; }
  .ind-row span { font-size: 7px; color: #525252; letter-spacing: 1.5px; }
  .ind-led { width: 8px; height: 8px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.4); flex-shrink: 0; }
  .ind-on    { background: #0a5a0a; box-shadow: 0 0 5px #00dd44; }
  .ind-amber { background: #5a3800; box-shadow: 0 0 4px #cc8800; }
  .ind-blink { background: #0a2060; box-shadow: 0 0 5px #1155ee; animation: blink-led 0.9s ease-in-out infinite; }
  .ind-dim   { background: #1a1a1a; }
  @keyframes blink-led { 0%,100%{opacity:1} 50%{opacity:0.12} }

  /* ── Reset button ── */
  .big-btn-section { margin-top: auto; }
  .big-btn {
    background: linear-gradient(to bottom, #3a1818, #220d0d);
    color: #6a2020;
    font-size: 8px;
    letter-spacing: 2px;
    text-align: center;
    padding: 9px 4px;
    border-radius: 4px;
    border: 1px solid #0e0e0e;
    box-shadow: 0 3px 0 #080808, inset 0 1px 2px rgba(255,255,255,0.04);
    cursor: pointer;
  }

  /* ── Center column ── */
  #crt-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  /* ── Screen bezel ── */
  #crt-screen-bezel {
    background: #0d0d0d;
    padding: 10px;
    border-radius: 6px;
    box-shadow: inset 0 0 0 1px #191919, inset 0 2px 8px rgba(0,0,0,0.75);
    width: 100%;
  }

  /* ── The actual screen ── */
  #crt-screen {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    box-shadow:
      inset 0 0 0 2px #060606,
      inset 0 0 20px rgba(0,0,0,0.8),
      /* Blue phosphor glow — subtle */
      0 0 12px rgba(20,80,255,0.18),
      0 0 30px rgba(20,80,255,0.07),
      0 0 65px rgba(20,80,255,0.03);
  }
  canvas { display: block; border-radius: 14px; background: #060d1f; }

  #crt-scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom, transparent 0px, transparent 2px,
      rgba(0,0,0,0.16) 2px, rgba(0,0,0,0.16) 4px
    );
    pointer-events: none; z-index: 2;
    border-radius: inherit;
  }
  /* Convex glass: corner vignette + top-left specular highlight */
  #crt-glass {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 28% 22%, rgba(255,255,255,0.05) 0%, transparent 52%),
      radial-gradient(ellipse at 50% 48%, transparent 28%, rgba(0,0,0,0.65) 100%);
    pointer-events: none; z-index: 3;
    border-radius: inherit;
  }

  /* ── Nameplate ── */
  #crt-nameplate {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #131313;
    border-radius: 4px;
    padding: 5px 12px;
    border: 1px solid #0d0d0d;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.55);
    width: 100%;
  }
  .nameplate-text { font-size: 11px; color: #545454; letter-spacing: 3px; }
  .nameplate-sub  { font-size: 8px; color: #3a3a3a; letter-spacing: 2px; flex: 1; text-align: center; }
  .led-np { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .led-np-grn   { background: #0a4a0a; box-shadow: 0 0 5px #00cc44; }
  .led-np-amber { background: #4a3000; box-shadow: 0 0 4px #cc8800; }

  /* ── Bottom strip ── */
  .bottom-left, .bottom-right { flex-shrink: 0; }
  .bottom-center { flex: 1; display: flex; justify-content: center; }
  .speaker-grille {
    width: 72px; height: 30px;
    background: repeating-linear-gradient(90deg, transparent 0, transparent 3px, #111 3px, #111 5px);
    border-radius: 2px;
    border: 1px solid #111;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.75);
  }
  .btn-row-bottom { display: flex; gap: 6px; align-items: center; }
  .flat-btn {
    background: linear-gradient(to bottom, #2c2c2c, #1e1e1e);
    color: #606060;
    font-size: 8px;
    letter-spacing: 1px;
    padding: 5px 9px;
    border-radius: 3px;
    border: 1px solid #111;
    box-shadow: 0 2px 0 #0c0c0c, inset 0 1px 1px rgba(255,255,255,0.04);
    cursor: pointer;
  }
  .flat-btn.active {
    background: linear-gradient(to bottom, #0c2a44, #06182c);
    color: #2f5f99;
    box-shadow: 0 2px 0 #040d18, 0 0 7px rgba(20,70,200,0.3);
  }
  .btn.pal-active {
    filter: brightness(2.2);
    box-shadow:
      inset 0 1px 2px rgba(255,255,255,0.2),
      0 0 8px rgba(200,220,255,0.45),
      0 2px 0 rgba(0,0,0,0.65);
  }

  #music-credit {
    position: fixed;
    bottom: 8px;
    right: 10px;
    font-size: 9px;
    color: #556677;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.5px;
    line-height: 1.4;
    pointer-events: all;
    background: rgba(0,0,0,0.55);
    padding: 3px 6px;
    border-radius: 3px;
  }
  #music-credit a { color: #6688aa; text-decoration: none; }
  #music-credit a:hover { color: #88aacc; text-decoration: underline; }
</style>
</head>
<body>
<div id="crt-outer">

  <!-- ── MAIN FACE ── -->
  <div id="crt-body">

    <!-- LEFT PANEL -->
    <div class="crt-side">
      <div class="side-screen">
        <div class="side-screen-content" style="justify-content:flex-start;gap:3px;padding:8px 7px">
          <div class="ss-data-label">SCORE</div>
          <div class="ss-data-value" id="term-score">0000000</div>
          <div class="ss-data-label" style="margin-top:5px">BEST</div>
          <div class="ss-data-dim" id="term-best">0000000</div>
        </div>
        <div class="side-screen-label">SCORE·MON</div>
        <div class="side-scanlines"></div>
      </div>
      <div class="btn-panel">
        <div class="panel-label">CONTROL</div>
        <div class="btn-grid">
          <div class="btn btn-red"></div>
          <div class="btn btn-yel"></div>
          <div class="btn btn-grn"></div>
          <div class="btn btn-blu"></div>
          <div class="btn btn-silv"></div>
          <div class="btn btn-pink"></div>

    <!-- CENTER — MAIN SCREEN -->

    <!-- RIGHT PANEL -->
    <div class="crt-side">
      <div class="side-screen">

          <div class="ss-data-label">LIVES</div>

  <!-- ── BOTTOM STRIP ── -->
  <div id="crt-bottom">
    <div class="bottom-left"><div class="speaker-grille"></div></div>
    <div class="bottom-center">
      <div class="btn-row-bottom">
        <div class="flat-btn active" id="btn-f1">SCAN</div>
        <div class="flat-btn active" id="btn-f2">MUTE</div>
        <div class="flat-btn active" id="btn-f3">LENS</div>
        <div class="flat-btn active" id="btn-f4">TILT</div>
        <div class="flat-btn" id="btn-run">PLAY</div>
        <div class="flat-btn" id="btn-hlt">PAUS</div>
        <div class="flat-btn" id="btn-rst">RSET</div>

    <div class="bottom-right"><div class="speaker-grille"></div></div>

</div><!-- end crt-outer -->

<audio id="bg-music" loop>
  <source src="mondamusic-synthwave-retro-80s-529570.mp3" type="audio/mpeg">
</audio>

<!-- Attribution -->
<div id="music-credit">Music by <a href="https://pixabay.com/users/mondamusic-54713575/?utm_source=link-attribution&utm_medium=referral&utm_campaign=music&utm_content=529570">MondaMusic</a> from <a href="https://pixabay.com//?utm_source=link-attribution&utm_medium=referral&utm_campaign=music&utm_content=529570">Pixabay</a></div>

<script>
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
const W = 480, H = 500;
cv.width = W;
cv.height = H;
const bgMusic = document.getElementById('bg-music');
bgMusic.volume = 0.45;

function startBgMusic() {
  bgMusic.play().catch(() => {});
}

// Try immediately; if blocked, start on first user interaction
const _autoplay = bgMusic.play();
if (_autoplay !== undefined) {
  _autoplay.catch(() => {
    const unlock = () => { startBgMusic(); document.removeEventListener('keydown', unlock); document.removeEventListener('click', unlock); };
    document.addEventListener('keydown', unlock, { once: true });
    document.addEventListener('click', unlock, { once: true });
  });
}

// ── INPUT ───────────────────────────────────────────────────────────────────
const KEY = {};
window.addEventListener('keydown', e => {
  KEY[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'Escape' && state === 'play') { paused = !paused; syncBottomBtns(); }
  ensureAudio();
});
window.addEventListener('keyup', e => { KEY[e.code] = false; });

// ── GAME STATE ──────────────────────────────────────────────────────────────
let state = 'menu'; // 'menu' | 'play' | 'over'
let paused = false;
let audioMuted = false;
let score = 0, best = 0, lives = 3, wave = 0, frame = 0;
let waveDelay = 0;
let waveAnnounce = 0; // frames to show "WAVE X" banner

// ── PLAYER ──────────────────────────────────────────────────────────────────
let px = W / 2, py = H - 80;
let pShootCD = 0, pInv = 0, pPow = null, pPowTimer = 0;
const P_SPD = 5, P_W = 28, P_H = 26;

// ── GAME OBJECTS ────────────────────────────────────────────────────────────
let shots = [];       // player bullets
let eshots = [];      // enemy bullets
let enemies = [];
let sparks = [];
let powerups = [];
let bossExplosions = [];
let screenFlash = 0;

// ── POWER-UP CONFIG ──────────────────────────────────────────────────────────
const PUPS = {
  rapid:  { color: '#00eeff', label: 'R', name: 'RAPID FIRE',  dur: 500 },
  triple: { color: '#ffdd00', label: 'T', name: 'TRIPLE SHOT', dur: 450 },
  life:   { color: '#ff55ff', label: '+', name: '+1 LIFE',     dur: 0   },
};

// ── STARFIELD ───────────────────────────────────────────────────────────────
const STARS = Array.from({ length: 95 }, () => ({
  x: Math.random() * W,
  y: Math.random() * H,
  r: Math.random() * 1.4 + 0.3,
  spd: Math.random() * 0.5 + 0.08,
  a: Math.random() * 0.5 + 0.15
}));

// ── INIT ─────────────────────────────────────────────────────────────────────
function startGame() {
  score = 0; lives = 3; wave = 0; frame = 0;
  waveDelay = 0; waveAnnounce = 0;
  shots = []; eshots = []; enemies = []; sparks = []; powerups = []; bossExplosions = []; screenFlash = 0;
  px = W / 2; py = H - 80;
  pShootCD = 0; pInv = 0; pPow = null; pPowTimer = 0;
  paused = false;
  nextWave();
  syncTerminal();
  state = 'play';
  syncBottomBtns();
}

// ── WAVE SYSTEM ──────────────────────────────────────────────────────────────
function nextWave() {
  wave++;
  waveAnnounce = 140;
  syncTerminal();
  playWave();

  if (wave % 5 === 0) {
    spawnBoss();
    return;
  }

  const n = Math.min(4 + wave * 2, 20);
  const cols = Math.min(n, wave <= 3 ? 5 : 6);
  const tier = wave <= 2 ? 0 : wave <= 5 ? 1 : 2;

  for (let i = 0; i < n; i++) {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x = 55 + col * ((W - 110) / Math.max(cols - 1, 1));
    const y = 55 + row * 68;
    spawnEnemy(x, y, tier);
  }
}

function spawnEnemy(x, y, tier) {
  enemies.push({
    x, y,
    ox: x,
    tier,
    hp: tier + 1,
    maxHp: tier + 1,
    spd: 0.65 + wave * 0.055,
    amp: 28 + tier * 18,
    freq: 0.009 + tier * 0.003,
    phase: Math.random() * 6.28,
    st: Math.floor(Math.random() * 100),
    scd: 90 + Math.floor(Math.random() * 140),
    isBoss: false
  });
}

function spawnBoss() {
  const tier = Math.floor(wave / 5);
  const hp  = 80 + (tier - 1) * 90;
  const vx  = 0.8 + (tier - 1) * 0.3;
  const scd = Math.max(35, 85 - (tier - 1) * 17);
  enemies.push({
    x: W / 2, y: 95,
    hp, maxHp: hp,
    vx, spd: 1,
    st: 0, scd,
    bphase: 0,
    tier,
    isBoss: true,
    twitchTimer: 0, twitchX: 0, twitchY: 0,
  });
}

// ── UPDATE ───────────────────────────────────────────────────────────────────
function update() {
  frame++;

  if (state !== 'play') {
    if (KEY['Space'] || KEY['KeyZ']) {
      KEY['Space'] = false; KEY['KeyZ'] = false;
      startGame();
    }
    tickSparks();
    return;
  }

  // Player move
  if (KEY['ArrowLeft'] || KEY['KeyA']) px -= P_SPD;
  if (KEY['ArrowRight'] || KEY['KeyD']) px += P_SPD;
  if (KEY['ArrowUp'] || KEY['KeyW']) py -= P_SPD;
  if (KEY['ArrowDown'] || KEY['KeyS']) py += P_SPD;
  px = clamp(px, P_W / 2 + 4, W - P_W / 2 - 4);
  py = clamp(py, 36, H - P_H / 2 - 4);

  if (pInv > 0) pInv--;
  if (pShootCD > 0) pShootCD--;

  // Player shoot
  if ((KEY['Space'] || KEY['KeyZ']) && pShootCD <= 0) {
    const sy = py - P_H / 2 - 2;
    if (pPow === 'triple') {
      shots.push({ x: px,     y: sy, vx:    0 });
      shots.push({ x: px - 4, y: sy, vx: -2.5 });
      shots.push({ x: px + 4, y: sy, vx:  2.5 });
    } else {
      shots.push({ x: px, y: sy, vx: 0 });
    }
    pShootCD = pPow === 'rapid' ? 4 : 9;
    playShoot();
    burst(px, py + P_H / 2 + 4, '#3388ee', 3, 2);
  }

  // Player bullets
  shots = shots.filter(s => {
    s.y -= 13;
    s.x += s.vx;
    if (s.y < -12 || s.x < -12 || s.x > W + 12) return false;
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const hw = e.isBoss ? 58 : 30, hh = e.isBoss ? 46 : 24;
      if (boxHit(s.x, s.y, 4, 9, e.x, e.y, hw, hh)) {
        e.hp--;
        burst(s.x, s.y, '#bbddff', 3, 1.8);
        if (e.hp <= 0) killEnemy(i);
        return false;
      }
    }
    return true;
  });

  // Enemy bullets
  eshots = eshots.filter(s => {
    s.x += s.vx; s.y += s.vy;
    if (s.y > H + 10 || s.x < -10 || s.x > W + 10) return false;
    if (pInv <= 0 && boxHit(s.x, s.y, 7, 7, px, py, P_W * 0.6, P_H * 0.6)) {
      hitPlayer();
      burst(s.x, s.y, '#ff3344', 6, 2.5);
      return false;
    }
    return true;
  });

  // Enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.isBoss ? tickBoss(e, i) : tickEnemy(e, i);
  }

  tickSparks();
  tickPowerups();
  tickBossExplosions();

  // Wave clear
  if (enemies.length === 0 && waveDelay === 0) waveDelay = 115;
  if (waveDelay > 0) { waveDelay--; if (waveDelay === 0) nextWave(); }

  // Wave announce timer
  if (waveAnnounce > 0) waveAnnounce--;
}

function tickEnemy(e, i) {
  e.y += e.spd;
  e.x = e.ox + Math.sin(frame * e.freq + e.phase) * e.amp;

  e.st--;
  if (e.st <= 0 && e.y > 30 && e.y < H - 70) {
    e.st = e.scd;
    if (Math.random() < 0.42 + wave * 0.035) {
      aimShot(e.x, e.y + 14, px, py, 2.6 + wave * 0.07);
    }
  }

  if (e.y > H + 50) { enemies.splice(i, 1); return; }

  if (pInv <= 0 && boxHit(e.x, e.y, 28, 22, px, py, P_W * 0.6, P_H * 0.6)) {
    burst(e.x, e.y, '#ff6600', 8, 3);
    enemies.splice(i, 1);
    hitPlayer();
  }
}

function tickBoss(e, i) {
  // Eye twitch
  if (e.twitchTimer > 0) {
    e.twitchTimer--;
    e.twitchX = (Math.random() - 0.5) * 8;
    e.twitchY = (Math.random() - 0.5) * 5;
    if (e.twitchTimer === 0) { e.twitchX = 0; e.twitchY = 0; }
  } else if (Math.random() < 0.007) {
    e.twitchTimer = 4 + Math.floor(Math.random() * 6);
  }

  e.x += e.vx * e.spd;
  if (e.x > W - 80 || e.x < 80) e.vx *= -1;

  const hpf = e.hp / e.maxHp;
  if (hpf < 0.5 && e.bphase === 0) e.bphase = 1;
  // Phase 2 threshold rises with each boss so later bosses spend longer in rage mode
  const phase2HP = Math.min(0.25, 0.10 + (e.tier - 1) * 0.05);
  if (hpf < phase2HP && e.bphase === 1) e.bphase = 2;

  e.st--;
  // Fire rate tightens with each boss
  const rate = e.bphase === 2
    ? Math.max(18, 38 - (e.tier - 1) * 5)
    : e.bphase === 1
      ? Math.max(28, 56 - (e.tier - 1) * 8)
      : Math.max(44, 80 - (e.tier - 1) * 12);
  if (e.st <= 0) {
    e.st = rate;
    const shotSpd   = 2.8 + (e.tier - 1) * 0.45;
    const spreadVx  = 2.0 + (e.tier - 1) * 0.28;
    const spreadVy  = 3.5 + (e.tier - 1) * 0.25;
    const cannonSpd = 2.4 + (e.tier - 1) * 0.3;
    if (e.bphase >= 1) {
      for (let a = -0.32; a <= 0.32; a += 0.16) {
        eshots.push({ x: e.x + Math.sin(a) * 45, y: e.y + 44, vx: Math.sin(a) * spreadVx, vy: spreadVy });
      }
    } else {
      aimShot(e.x, e.y + 44, px, py, shotSpd);
    }
    if (e.bphase >= 2) {
      aimShot(e.x - 52, e.y + 10, px, py, cannonSpd);
      aimShot(e.x + 52, e.y + 10, px, py, cannonSpd);
    }
  }

  if (pInv <= 0 && boxHit(e.x, e.y, 58, 46, px, py, P_W * 0.6, P_H * 0.6)) hitPlayer();
}

function killEnemy(i) {
  const e = enemies[i];
  score += e.isBoss ? 2000 + wave * 500 : (e.tier + 1) * 100;
  burst(e.x, e.y, '#ffcc44', e.isBoss ? 30 : 10, e.isBoss ? 5 : 3);
  if (e.isBoss) { burst(e.x, e.y, '#ff3366', 18, 4); startBossExplosion(e.x, e.y); }
  tryDropPowerup(e.x, e.y, e.isBoss);
  playExplode(e.isBoss);
  enemies.splice(i, 1);
  syncTerminal();
}

function tryDropPowerup(x, y, isBoss) {
  if (!isBoss && Math.random() > 0.14) return;
  const roll = Math.random();
  const type = roll < 0.40 ? 'rapid' : roll < 0.78 ? 'triple' : 'life';
  powerups.push({ x, y, type, bob: Math.random() * 6.28, age: 0 });
}

function tickPowerups() {
  if (pPow && pPowTimer > 0) { pPowTimer--; if (pPowTimer <= 0) pPow = null; }
  powerups = powerups.filter(p => {
    p.y += 1.6;
    p.bob += 0.06;
    p.age++;
    if (p.y > H + 20) return false;
    if (boxHit(p.x, p.y, 22, 22, px, py, P_W + 12, P_H + 12)) {
      collectPowerup(p.type);
      return false;
    }
    return true;
  });
}

function collectPowerup(type) {
  playPowerup();
  if (type === 'life') {
    lives = Math.min(lives + 1, 6);
    burst(px, py, '#ff88ff', 16, 3.5);
  } else {
    pPow = type;
    pPowTimer = PUPS[type].dur;
    burst(px, py, PUPS[type].color, 12, 3);
  }
}

function hitPlayer() {
  if (pInv > 0) return;
  lives--;
  pInv = 115;
  burst(px, py, '#2266ff', 14, 3.5);
  playHit();
  if (lives <= 0) { if (score > best) best = score; state = 'over'; syncBottomBtns(); }
  syncTerminal();
}

function aimShot(x, y, tx, ty, spd) {
  const dx = tx - x, dy = ty - y, d = Math.sqrt(dx * dx + dy * dy) || 1;
  eshots.push({ x, y, vx: dx / d * spd, vy: dy / d * spd });
}

function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, v = Math.random() * spd + 0.5;
    sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, decay: 0.026 + Math.random() * 0.02, r: Math.random() * 2.5 + 0.5, color });
  }
}

function tickSparks() {
  sparks = sparks.filter(s => {
    s.x += s.vx; s.y += s.vy; s.vx *= 0.93; s.vy *= 0.93; s.life -= s.decay;
    return s.life > 0;
  });
}

function boxHit(ax, ay, aw, ah, bx, by, bw, bh) {
  return Math.abs(ax - bx) < (aw + bw) / 2 && Math.abs(ay - by) < (ah + bh) / 2;
}

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

// ── DRAWING ───────────────────────────────────────────────────────────────────
function drawBg() {
  cx.fillStyle = '#060d1f';
  cx.fillRect(0, 0, W, H);

  // Nebula blobs
  const blobs = [
    { x: W * 0.25, y: H * 0.35, r: 170, g: [0, 30, 120] },
    { x: W * 0.78, y: H * 0.22, r: 130, g: [60, 0, 130] },
    { x: W * 0.55, y: H * 0.72, r: 160, g: [0, 50, 110] }
  ];
  blobs.forEach(b => {
    const gr = cx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    gr.addColorStop(0, `rgba(${b.g[0]},${b.g[1]},${b.g[2]},0.18)`);
    gr.addColorStop(1, `rgba(${b.g[0]},${b.g[1]},${b.g[2]},0)`);
    cx.fillStyle = gr;
    cx.beginPath(); cx.arc(b.x, b.y, b.r, 0, 6.28); cx.fill();
  });

  // Stars
  STARS.forEach(s => {
    s.y += s.spd;
    if (s.y > H + 2) { s.y = 0; s.x = Math.random() * W; }
    cx.globalAlpha = Math.min(1, s.a * 2);
    cx.fillStyle = '#bbddff';
    cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.28); cx.fill();
  });
  cx.globalAlpha = 1;
}

function drawShip(x, y, flicker) {
  if (flicker && Math.floor(frame / 5) % 2 === 0) return;

  // Thruster flame
  const fl = 9 + Math.sin(frame * 0.35) * 4;
  cx.globalAlpha = 0.8;
  cx.fillStyle = '#ff9900';
  cx.beginPath();
  cx.moveTo(x - 5, y + 13); cx.lineTo(x + 5, y + 13); cx.lineTo(x, y + 13 + fl);
  cx.closePath(); cx.fill();
  cx.globalAlpha = 0.4;
  cx.fillStyle = '#ffcc44';
  cx.beginPath();
  cx.moveTo(x - 2, y + 13); cx.lineTo(x + 2, y + 13); cx.lineTo(x, y + 13 + fl * 0.6);
  cx.closePath(); cx.fill();
  cx.globalAlpha = 1;

  // Wings
  cx.fillStyle = PAL.p[0];
  cx.beginPath();
  cx.moveTo(x, y - 13); cx.lineTo(x - 24, y + 7); cx.lineTo(x - 13, y + 13); cx.lineTo(x - 1, y + 5);
  cx.closePath(); cx.fill();
  cx.beginPath();
  cx.moveTo(x, y - 13); cx.lineTo(x + 24, y + 7); cx.lineTo(x + 13, y + 13); cx.lineTo(x + 1, y + 5);
  cx.closePath(); cx.fill();

  // Wing accent
  cx.fillStyle = PAL.p[1];
  cx.beginPath();
  cx.moveTo(x - 2, y - 6); cx.lineTo(x - 18, y + 5); cx.lineTo(x - 13, y + 7); cx.lineTo(x - 2, y + 2);
  cx.closePath(); cx.fill();
  cx.beginPath();
  cx.moveTo(x + 2, y - 6); cx.lineTo(x + 18, y + 5); cx.lineTo(x + 13, y + 7); cx.lineTo(x + 2, y + 2);
  cx.closePath(); cx.fill();

  // Body
  cx.fillStyle = PAL.p[2];
  cx.beginPath();
  cx.moveTo(x, y - 16); cx.lineTo(x + 8, y + 3); cx.lineTo(x + 7, y + 13); cx.lineTo(x - 7, y + 13); cx.lineTo(x - 8, y + 3);
  cx.closePath(); cx.fill();

  // Body outline
  cx.strokeStyle = PAL.p[3];
  cx.lineWidth = 1.5;
  cx.beginPath();
  cx.moveTo(x, y - 16); cx.lineTo(x + 8, y + 3); cx.lineTo(x + 7, y + 13); cx.lineTo(x - 7, y + 13); cx.lineTo(x - 8, y + 3);
  cx.closePath(); cx.stroke();

  // Cockpit
  cx.fillStyle = PAL.p[4];
  cx.beginPath(); cx.ellipse(x, y - 4, 5, 7, 0, 0, 6.28); cx.fill();
  cx.fillStyle = PAL.p[5];
  cx.beginPath(); cx.ellipse(x - 1.5, y - 6, 2, 3, -0.3, 0, 6.28); cx.fill();
}

const BTN_PAL = [1, 2, 3, 4, 5, 6, 7, 8, 0];
let PAL = PALETTES[0];

function drawEnemy(e) {
  if (e.isBoss) { drawBossEnemy(e); return; }
  const x = e.x, y = e.y, t = e.tier;

  cx.fillStyle = PAL.e[0][t];

  if (t === 0) {
    // Scout: pointed pentagon
    cx.beginPath();
    cx.moveTo(x, y - 14); cx.lineTo(x + 15, y + 4); cx.lineTo(x + 9, y + 14);
    cx.lineTo(x - 9, y + 14); cx.lineTo(x - 15, y + 4);
    cx.closePath(); cx.fill();
    cx.fillStyle = PAL.e[1][0];
    cx.beginPath(); cx.arc(x, y + 2, 4, 0, 6.28); cx.fill();
  } else if (t === 1) {
    // Cruiser: wider with side guns
    cx.beginPath();
    cx.moveTo(x, y - 15); cx.lineTo(x + 20, y + 2); cx.lineTo(x + 14, y + 14);
    cx.lineTo(x - 14, y + 14); cx.lineTo(x - 20, y + 2);
    cx.closePath(); cx.fill();
    cx.fillStyle = PAL.e[0][1];
    cx.fillRect(x - 23, y + 4, 9, 6);
    cx.fillRect(x + 14, y + 4, 9, 6);
    cx.fillStyle = PAL.e[1][1];
    cx.beginPath(); cx.ellipse(x, y + 2, 6, 5, 0, 0, 6.28); cx.fill();
  } else {
    // Destroyer: heavy hulk
    cx.beginPath();
    cx.moveTo(x, y - 16); cx.lineTo(x + 24, y + 0); cx.lineTo(x + 18, y + 16);
    cx.lineTo(x - 18, y + 16); cx.lineTo(x - 24, y + 0);
    cx.closePath(); cx.fill();
    cx.fillStyle = PAL.e[0][2];
    cx.fillRect(x - 26, y + 3, 10, 7);
    cx.fillRect(x + 16, y + 3, 10, 7);
    cx.fillStyle = PAL.e[1][2];
    cx.beginPath(); cx.ellipse(x, y + 2, 7, 7, 0, 0, 6.28); cx.fill();
    cx.fillStyle = PAL.e[2];
    cx.beginPath(); cx.ellipse(x, y + 2, 3, 3, 0, 0, 6.28); cx.fill();
  }

  // Outline glow-ish
  cx.strokeStyle = PAL.e[1][t];
  cx.lineWidth = 1;
  cx.globalAlpha = 0.35;
  cx.beginPath();
  if (t === 0) { cx.moveTo(x, y-14); cx.lineTo(x+15, y+4); cx.lineTo(x+9, y+14); cx.lineTo(x-9, y+14); cx.lineTo(x-15, y+4); cx.closePath(); }
  else if (t === 1) { cx.moveTo(x, y-15); cx.lineTo(x+20, y+2); cx.lineTo(x+14, y+14); cx.lineTo(x-14, y+14); cx.lineTo(x-20, y+2); cx.closePath(); }

  cx.stroke();
  cx.globalAlpha = 1;

  // HP bar if damaged
  if (e.hp < e.maxHp) {
    cx.fillStyle = '#2a0000';
    cx.fillRect(x - 14, y - 21, 28, 4);
    cx.fillStyle = '#ee2222';
    cx.fillRect(x - 14, y - 21, 28 * (e.hp / e.maxHp), 4);
  }
}

function drawBossEnemy(e) {
  const x = e.x, y = e.y;
  const hpf = e.hp / e.maxHp;
  const pulse = 1 + Math.sin(frame * 0.06) * 0.025;

  cx.save();
  cx.translate(x, y);
  cx.scale(pulse, pulse);

  // Hull
  cx.fillStyle = PAL.b[0];
  cx.beginPath();
  cx.moveTo(0, -46); cx.lineTo(50, -14); cx.lineTo(54, 20);
  cx.lineTo(26, 38); cx.lineTo(-26, 38); cx.lineTo(-54, 20);
  cx.lineTo(-50, -14);
  cx.closePath(); cx.fill();

  // Core eye (twitches randomly)
  const tx = e.twitchX || 0, ty = e.twitchY || 0;
  cx.fillStyle = PAL.b[1];
  cx.beginPath(); cx.ellipse(tx, -8 + ty, 22, 22, 0, 0, 6.28); cx.fill();
  cx.fillStyle = PAL.b[2];
  cx.beginPath(); cx.ellipse(tx, -8 + ty, 13, 13, 0, 0, 6.28); cx.fill();
  cx.fillStyle = PAL.b[3];
  cx.beginPath(); cx.ellipse(-4 + tx, -12 + ty, 5, 6, 0, 0, 6.28); cx.fill();

  // Wing cannons
  cx.fillStyle = PAL.b[4];
  cx.fillRect(-55, 8, 24, 10);
  cx.fillRect(31, 8, 24, 10);
  cx.fillStyle = PAL.b[5];
  cx.fillRect(-58, 10, 6, 6);
  cx.fillRect(52, 10, 6, 6);

  // Hull lines
  cx.strokeStyle = PAL.b[6];
  cx.lineWidth = 1.5;
  cx.beginPath(); cx.moveTo(-36, -2); cx.lineTo(36, -2); cx.stroke();
  cx.beginPath(); cx.moveTo(-26, 14); cx.lineTo(26, 14); cx.stroke();

  cx.restore();

  // HP bar
  const bw = 130;
  cx.fillStyle = 'rgba(0,0,0,0.65)';
  cx.fillRect(x - bw / 2, y + 50, bw, 8);
  cx.fillStyle = hpf > 0.5 ? '#dd1144' : hpf > 0.25 ? '#ff5500' : '#ff1100';
  cx.fillRect(x - bw / 2, y + 50, bw * hpf, 8);
  cx.strokeStyle = PAL.b[6];
  cx.lineWidth = 1;
  cx.strokeRect(x - bw / 2, y + 50, bw, 8);

  // Boss label above HP
  cx.fillStyle = PAL.b[7];
  cx.font = '10px "Courier New", monospace';
  cx.textAlign = 'center';
  cx.fillText('VOID LORD', x, y + 47);
}

function drawPowerups() {
  powerups.forEach(p => {
    const cfg = PUPS[p.type];
    const bob = Math.sin(p.bob) * 4;
    const r = 13;
    const x = p.x, y = p.y + bob;

    // Pulsing outer ring
    cx.strokeStyle = cfg.color;
    cx.lineWidth = 1;
    cx.globalAlpha = 0.25 + Math.sin(p.bob * 2) * 0.1;
    cx.beginPath(); cx.arc(x, y, r + 6, 0, 6.28); cx.stroke();
    cx.globalAlpha = 1;

    // Diamond fill
    cx.fillStyle = '#010d1a';
    cx.beginPath();
    cx.moveTo(x, y - r); cx.lineTo(x + r, y); cx.lineTo(x, y + r); cx.lineTo(x - r, y);
    cx.closePath(); cx.fill();

    // Diamond tint
    cx.fillStyle = cfg.color;
    cx.globalAlpha = 0.18;
    cx.beginPath();
    cx.moveTo(x, y - r + 2); cx.lineTo(x + r - 2, y); cx.lineTo(x, y + r - 2); cx.lineTo(x - r + 2, y);
    cx.closePath(); cx.fill();
    cx.globalAlpha = 1;

    // Diamond border
    cx.strokeStyle = cfg.color;
    cx.lineWidth = 1.5;
    cx.beginPath();
    cx.moveTo(x, y - r); cx.lineTo(x + r, y); cx.lineTo(x, y + r); cx.lineTo(x - r, y);
    cx.closePath(); cx.stroke();

    // Label letter
    cx.fillStyle = cfg.color;
    cx.font = 'bold 11px "Courier New", monospace';
    cx.textAlign = 'center';
    cx.fillText(cfg.label, x, y + 4);
  });
}

function drawShots() {
  // Player shots — power-up colours override palette base colour
  cx.fillStyle = pPow === 'triple' ? '#ffee44' : pPow === 'rapid' ? '#00eeff' : PAL.p[4];
  shots.forEach(s => {
    cx.beginPath(); cx.ellipse(s.x, s.y, 3, 7, 0, 0, 6.28); cx.fill();
  });
  // Enemy shots — outer uses enemy trim, inner uses enemy core colour
  cx.fillStyle = PAL.e[1][0];
  eshots.forEach(s => {
    cx.beginPath(); cx.arc(s.x, s.y, 4, 0, 6.28); cx.fill();
  });
  cx.fillStyle = PAL.e[2];
  eshots.forEach(s => {
    cx.beginPath(); cx.arc(s.x, s.y, 2, 0, 6.28); cx.fill();
  });
}

function drawSparks() {
  sparks.forEach(s => {
    cx.globalAlpha = s.life;
    cx.fillStyle = s.color;
    cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.28); cx.fill();
  });
  cx.globalAlpha = 1;
}

function syncTerminal() {
  const ts = document.getElementById('term-score');
  const tb = document.getElementById('term-best');
  const tw = document.getElementById('term-wave');
  const tl = document.getElementById('term-lives');
  if (ts) ts.textContent = String(score).padStart(7, '0');
  if (tb) tb.textContent = String(best).padStart(7, '0');
  if (tw) tw.textContent = String(wave).padStart(2, '0');
  if (tl) tl.textContent = '▲ '.repeat(Math.max(0, lives)).trim() || '—';
}

function drawHUD() {
  // Active power-up badge (top centre of canvas)
  if (pPow) {
    const cfg = PUPS[pPow];
    const frac = pPowTimer / cfg.dur;
    const low = frac < 0.25;
    const blink = low && Math.floor(frame / 7) % 2 === 0;
    cx.fillStyle = 'rgba(1,8,22,0.88)';
    cx.fillRect(W / 2 - 68, 8, 136, 24);
    cx.strokeStyle = blink ? '#ffffff' : cfg.color;
    cx.lineWidth = 1;
    cx.strokeRect(W / 2 - 68, 8, 136, 24);
    cx.fillStyle = blink ? '#ffffff' : cfg.color;
    cx.font = 'bold 10px "Courier New", monospace';
    cx.textAlign = 'center';
    cx.fillText('⚡ ' + cfg.name, W / 2, 20);
    cx.fillStyle = '#000d1f';
    cx.fillRect(W / 2 - 60, 24, 120, 4);
    cx.fillStyle = cfg.color;
    cx.globalAlpha = blink ? 0.5 : 1;
    cx.fillRect(W / 2 - 60, 24, 120 * frac, 4);
    cx.globalAlpha = 1;
  }

  // Wave announce banner
  if (waveAnnounce > 0) {
    const alpha = Math.min(1, waveAnnounce / 30) * Math.min(1, waveAnnounce / 140 * 3);
    cx.globalAlpha = alpha;
    cx.fillStyle = '#001a44';
    cx.fillRect(W / 2 - 130, H / 2 - 30, 260, 52);
    cx.strokeStyle = '#0044aa';
    cx.lineWidth = 1;
    cx.strokeRect(W / 2 - 130, H / 2 - 30, 260, 52);
    cx.fillStyle = wave % 5 === 0 ? '#ff2244' : '#44aaff';
    cx.font = 'bold 22px "Courier New", monospace';
    cx.textAlign = 'center';
    cx.fillText(wave % 5 === 0 ? '⚠ VOID LORD ⚠' : 'WAVE  ' + String(wave).padStart(2, '0'), W / 2, H / 2 + 8);
    cx.globalAlpha = 1;
  }
}

function drawMenu() {
  cx.textAlign = 'center';

  // Drop shadow
  cx.fillStyle = '#002266';
  cx.font = 'bold 50px "Courier New", monospace';
  cx.fillText('STELLAR', W / 2 + 2, H / 2 - 76 + 2);
  cx.fillStyle = '#55aaff';
  cx.fillText('STELLAR', W / 2, H / 2 - 76);

  cx.fillStyle = '#002266';
  cx.font = 'bold 38px "Courier New", monospace';
  cx.fillText('MOTH', W / 2 + 2, H / 2 - 30 + 2);
  cx.fillStyle = '#aaddff';
  cx.fillText('MOTH', W / 2, H / 2 - 30);

  cx.fillStyle = '#7799bb';
  cx.font = '12px "Courier New", monospace';
  cx.fillText('DEFEND THE NEBULA · DESTROY THE SWARM', W / 2, H / 2 + 16);

  cx.fillStyle = '#6688aa';
  cx.fillText('ARROWS / WASD  ·  SPACE or Z to fire', W / 2, H / 2 + 40);

  const blink = Math.floor(frame / 22) % 2 === 0;
  if (blink) {
    cx.fillStyle = '#cceeff';
    cx.font = 'bold 15px "Courier New", monospace';
    cx.fillText('▶  PRESS SPACE OR CLICK TO START  ◀', W / 2, H / 2 + 74);
  }

  if (best > 0) {
    cx.fillStyle = '#eeaa22';
    cx.font = '13px "Courier New", monospace';
    cx.fillText('BEST  ' + String(best).padStart(7, '0'), W / 2, H / 2 + 104);

function drawGameOver() {
  cx.fillStyle = 'rgba(3,6,14,0.84)';
  cx.fillRect(0, 0, W, H);

  cx.textAlign = 'center';
  cx.fillStyle = '#660011';
  cx.font = 'bold 46px "Courier New", monospace';
  cx.fillText('MISSION', W / 2 + 2, H / 2 - 62 + 2);
  cx.fillStyle = '#ee1133';
  cx.fillText('MISSION', W / 2, H / 2 - 62);

  cx.fillStyle = '#440008';
  cx.font = 'bold 46px "Courier New", monospace';
  cx.fillText('FAILED', W / 2 + 2, H / 2 - 14 + 2);
  cx.fillStyle = '#cc0022';
  cx.fillText('FAILED', W / 2, H / 2 - 14);

  cx.fillStyle = '#44aaff';
  cx.font = 'bold 20px "Courier New", monospace';
  cx.fillText(String(score).padStart(7, '0'), W / 2, H / 2 + 32);

  if (score >= best && score > 0) {
    cx.fillStyle = '#ffcc22';
    cx.font = 'bold 13px "Courier New", monospace';
    cx.fillText('★  NEW RECORD  ★', W / 2, H / 2 + 60);
  } else if (best > 0) {
    cx.fillStyle = '#223344';
    cx.font = '12px "Courier New", monospace';
    cx.fillText('BEST  ' + String(best).padStart(7, '0'), W / 2, H / 2 + 60);
  }

  const blink = Math.floor(frame / 22) % 2 === 0;
  if (blink) {
    cx.fillStyle = '#88ccff';
    cx.font = 'bold 14px "Courier New", monospace';
    cx.fillText('▶  PRESS SPACE TO RETRY  ◀', W / 2, H / 2 + 96);
  }
}

// ── BOSS EXPLOSION ───────────────────────────────────────────────────────────
function startBossExplosion(x, y) {
  bossExplosions.push({ x, y, timer: 95 });
  screenFlash = 24;
  burst(x, y, '#ffffff', 28, 8);
  burst(x, y, '#ffcc44', 22, 6);
  burst(x, y, '#ff4400', 18, 5);
}

function tickBossExplosions() {
  if (screenFlash > 0) screenFlash--;
  bossExplosions = bossExplosions.filter(ex => {
    ex.timer--;
    if (ex.timer % 7 === 0) {
      const rx = ex.x + (Math.random() - 0.5) * 110;
      const ry = ex.y + (Math.random() - 0.5) * 80;
      burst(rx, ry, '#ffaa22', 10, 4);
      burst(rx, ry, '#ff3300', 7, 3.5);
    }
    if (ex.timer % 23 === 0) burst(ex.x, ex.y, '#ffee88', 18, 5.5);
    return ex.timer > 0;
  });
}

function drawBossExplosions() {
  bossExplosions.forEach(ex => {
    const prog = 1 - ex.timer / 95;
    const r1 = prog * 165;
    cx.strokeStyle = `rgba(255,175,30,${Math.max(0, 0.7 - prog * 0.85)})`;
    cx.lineWidth = 4 + (1 - prog) * 14;
    cx.beginPath(); cx.arc(ex.x, ex.y, r1, 0, 6.28); cx.stroke();
    if (prog > 0.15) {
      const r2 = (prog - 0.15) * 165;
      cx.strokeStyle = `rgba(255,70,0,${Math.max(0, 0.55 - (prog - 0.15) * 0.85)})`;
      cx.lineWidth = 2 + (1 - prog) * 9;
      cx.beginPath(); cx.arc(ex.x, ex.y, r2, 0, 6.28); cx.stroke();
    }
  });
}

// ── AUDIO SYSTEM ─────────────────────────────────────────────────────────────
let audioCtx = null, masterGain = null;
function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.connect(audioCtx.destination);
    masterGain.gain.value = 0.55;
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function tone(freq, freq2, dur, vol, type) {
  if (!audioCtx || audioMuted) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(Math.max(1, freq2), audioCtx.currentTime + dur);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain); gain.connect(masterGain);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}

function noise(dur, vol, cutoff) {
  if (!audioCtx || audioMuted) return;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const flt = audioCtx.createBiquadFilter();
  flt.type = 'lowpass'; flt.frequency.value = cutoff;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  src.connect(flt); flt.connect(gain); gain.connect(masterGain);
  src.start(); src.stop(audioCtx.currentTime + dur);
}

function playShoot()      { tone(660, 330, 0.07, 0.18, 'square'); }
function playExplode(big) { noise(big ? 0.55 : 0.18, big ? 0.65 : 0.3, big ? 280 : 750); if (big) tone(70, 35, 0.5, 0.4, 'sine'); }
function playHit()        { tone(160, 55, 0.28, 0.3, 'sawtooth'); noise(0.12, 0.25, 600); }
function playPowerup()    { tone(440, 880, 0.12, 0.18, 'sine'); setTimeout(() => tone(880, 1760, 0.1, 0.12, 'sine'), 100); }
function playWave()       { if (audioCtx) tone(330, 660, 0.25, 0.12, 'sine'); }

// ── KNOB SYSTEM ───────────────────────────────────────────────────────────────
const KNOB = {
  vol: { angle: 45,  tickEl: null },
  brt: { angle: 80,  tickEl: null }
};
let dragKnob = null, dragY0 = 0, dragA0 = 0;

function applyKnob(name) {
  const k = KNOB[name];
  const pct = (k.angle + 135) / 270;
  if (k.tickEl) k.tickEl.style.transform = `translateX(-50%) rotate(${k.angle}deg)`;
  if (name === 'vol') {
    if (masterGain) masterGain.gain.value = pct * pct * 1.2;
    bgMusic.volume = Math.min(1, pct * pct * 1.2);
  }
  if (name === 'brt') {
    const brightness = 0.25 + pct * 1.3;
    cv.style.filter = `brightness(${brightness})`;
  }
}

function syncBottomBtns() {
  document.getElementById('btn-run')?.classList.toggle('active', !paused && state === 'play');
  document.getElementById('btn-hlt')?.classList.toggle('active', paused && state === 'play');
}

function initBottomButtons() {
  const f1  = document.getElementById('btn-f1');
  const f2  = document.getElementById('btn-f2');
  const f3  = document.getElementById('btn-f3');
  const f4  = document.getElementById('btn-f4');
  const run = document.getElementById('btn-run');
  const hlt = document.getElementById('btn-hlt');
  const rst = document.getElementById('btn-rst');

  // F1 — toggle scanlines
  f1?.addEventListener('click', () => {
    const on = f1.classList.toggle('active');
    document.getElementById('crt-scanlines').style.display = on ? '' : 'none';
    document.querySelectorAll('.side-scanlines').forEach(el => el.style.display = on ? '' : 'none');
  });

  // F2 — mute / unmute all audio
  f2?.addEventListener('click', () => {
    audioMuted = !audioMuted;
    bgMusic.muted = audioMuted;
    f2.classList.toggle('active', !audioMuted);
  });

  // F3 — toggle CRT glass / vignette
  f3?.addEventListener('click', () => {
    const on = f3.classList.toggle('active');
    document.getElementById('crt-glass').style.display = on ? '' : 'none';
  });

  // F4 — toggle perspective tilt
  f4?.addEventListener('click', () => {
    const on = f4.classList.toggle('active');
    document.getElementById('crt-outer').style.transform = on ? '' : 'none';
  });

  // RUN — start game or resume from pause
  run?.addEventListener('click', () => {
    if (state === 'menu' || state === 'over') { startGame(); return; }
    if (state === 'play') { paused = false; syncBottomBtns(); }
  });

  // HLT — pause game
  hlt?.addEventListener('click', () => {
    if (state !== 'play' || paused) return;
    paused = true;
    syncBottomBtns();
  });

  // RST — force restart at any time
  rst?.addEventListener('click', () => { startGame(); });
}

function initButtons() {
  const btns = [...document.querySelectorAll('.btn-grid .btn')];
  btns.forEach((btn, i) => {
    btn.style.cursor = 'pointer';
    btn.addEventListener('click', () => {
      PAL = PALETTES[BTN_PAL[i]];
      btns.forEach(b => b.classList.remove('pal-active'));
      btn.classList.add('pal-active');
    });
  });
  // Wire RESET big-btn to restart game
  document.querySelector('.big-btn')?.addEventListener('click', () => {
    if (state !== 'play') startGame();
  });
}

function initKnobs() {
  KNOB.vol.tickEl = document.getElementById('tick-vol');
  KNOB.brt.tickEl = document.getElementById('tick-brt');
  applyKnob('vol'); applyKnob('brt');
  ['vol', 'brt'].forEach(name => {
    const el = document.getElementById('knob-' + name);
    if (!el) return;
    el.addEventListener('mousedown', e => {
      ensureAudio();
      dragKnob = name; dragY0 = e.clientY; dragA0 = KNOB[name].angle;
      e.preventDefault();
    });
  });
  document.addEventListener('mousemove', e => {
    if (!dragKnob) return;
    KNOB[dragKnob].angle = Math.max(-135, Math.min(135, dragA0 + (dragY0 - e.clientY) * 1.8));
    applyKnob(dragKnob);
  });
  document.addEventListener('mouseup', () => { dragKnob = null; });
}

// ── MAIN LOOP ─────────────────────────────────────────────────────────────────
function draw() {
  drawBg();
  if (state === 'play') {
    enemies.forEach(drawEnemy);
    drawShots();
    drawPowerups();
    drawBossExplosions();
    drawSparks();
    drawShip(px, py, pInv > 0);
    drawHUD();
    if (screenFlash > 0) {
      cx.fillStyle = `rgba(255,200,50,${(screenFlash / 24) * 0.6})`;
      cx.fillRect(0, 0, W, H);
    }
    if (paused) {
      cx.fillStyle = 'rgba(0,4,18,0.75)';
      cx.fillRect(0, 0, W, H);
      cx.fillStyle = '#0a1e44';
      cx.fillRect(W / 2 - 110, H / 2 - 30, 220, 52);
      cx.strokeStyle = '#1a3a88';
      cx.lineWidth = 1;
      cx.strokeRect(W / 2 - 110, H / 2 - 30, 220, 52);
      cx.fillStyle = '#4488ff';
      cx.font = 'bold 20px "Courier New", monospace';
      cx.textAlign = 'center';
      cx.fillText('— HALTED —', W / 2, H / 2 + 2);
      cx.fillStyle = '#223355';
      cx.font = '10px "Courier New", monospace';
      cx.fillText('PRESS  PLAY  OR  ESC  TO  RESUME', W / 2, H / 2 + 18);
    }
  } else if (state === 'menu') {
    drawMenu();
  } else {
    // game over — keep scene alive
    enemies.forEach(drawEnemy);
    drawShots();
    drawSparks();
    drawGameOver();
  }
}

function loop() {
  try {
    if (!paused) update();
    draw();
  } catch(e) {
    console.error('Game error:', e);
  }
  requestAnimationFrame(loop);
}

cv.addEventListener('click', () => {
  ensureAudio();
  if (state === 'menu' || state === 'over') startGame();
});

loop();
initBottomButtons();
initButtons();
initKnobs();
</script>
